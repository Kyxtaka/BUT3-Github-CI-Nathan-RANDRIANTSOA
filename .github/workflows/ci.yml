name: Code Check + cov test
on:
  push:
    branches: [ main ]
  pull_request:
    branches:
      - main

env: 
  PYTHON_VERSION: "3.12.10" 
  PYTHONPATH: "./src"
  COVERAGE_RCFILE: ".coveragerc" 
  COVERAGE_PATH: "."
  WHL_PACKAGE_PATH: "./dist/mypackage-0.1-py3-none-any.whl"

jobs:

  build_package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: setup python packagewith python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with: 
          python-version: ${{ env.PYTHON_VERSION }} 
          cache: 'pip'

      - name: install setup tools
        run: pip install --upgrade build

      - name: build package
        run: python -m build

      - name: upload whl package
        uses: actions/upload-artifact@v4
        with: 
          name: mypackage.whl
          path: ${{ env.WHL_PACKAGE_PATH }}


  linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: set up python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with: 
          python-version: ${{ env.PYTHON_VERSION }} 
          cache: 'pip'
      
      - name: install dependencies 
        run: |
          pip install flake8 autopep8
          pip install -r requirements.txt

      - name: run-flake8
        run: PYTHONPATH=${{ env.PYTHONPATH }} flake8 **/*.py || true

      - name: formatage-code 
        run: autopep8 --in-place --aggressive --aggressive src/**/*.py
      
  unit_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: download whl package
        uses: actions/download-artifact@v5
        with:
          name: mypackage.whl
          path: ${{ env.WHL_PACKAGE_PATH }}

      - name: set up python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with: 
          python-version: ${{ env.PYTHON_VERSION }} 

      - name: install-dependencies
        run: pip install --force-reinstall ${{ env.WHL_PACKAGE_PATH }}

      - name: run-test-cov
        run: | 
          pytest --cov --cov-config=${{ env.COVERAGE_RCFILE }}

      - name: upload coverage report
        uses: actions/upload-artifact@v4
        with: 
          name: coverage-report
          path: ${{ env.COVERAGE_PATH }}




      
      