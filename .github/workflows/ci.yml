name: Code Check + cov test
on:
  push:
    branches: [ main ]
  pull_request:
    branches:
      - main

env: 
  PYTHON_VERSION: "3.12.10" 
  PYTHONPATH: "./src"
  COVERAGE_RCFILE: ".coveragerc" 
  COVERAGE_PATH: "."

jobs:

  linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: set up python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with: 
          python-version: ${{ env.PYTHON_VERSION }} 
          cache: 'pip'
      
      - name: install dependencies 
        run: |
          pip install flake8 autopep8
          pip install -r requirements.txt

      - name: run-flake8
        run: PYTHONPATH=${{ env.PYTHONPATH }} flake8 **/*.py || true

      - name: formatage-code 
        run: autopep8 --in-place --aggressive --aggressive src/**/*.py
      
  unit_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: set up python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with: 
          python-version: ${{ env.PYTHON_VERSION }} 

      - name: install-dependencies
        run: pip install -r ./requirements.txt

      - name: run-test-cov
        run: | 
          PYTHONPATH=${{ env.PYTHONPATH }} pytest --cov --cov-config=${{ env.COVERAGE_RCFILE }}

      - name: upload coverage report
        uses: actions/upload-artifact@v4
        with: 
          name: coverage-report
          path: ${{ env.COVERAGE_PATH }}

