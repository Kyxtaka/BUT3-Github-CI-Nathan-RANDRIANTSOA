name: CD deployement Docker

on:
  push:
    branches: [ main ]  
  pull_request:
    branches:
      - main

jobs:
  push-docker-backend:
    runs-on: ubuntu-latest
    environment : dev
    steps: 
      - uses: actions/checkout@v3

      - name: Login to docker hub
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ADRESSE }}
          username: ${{ secrets.LOGIN }}
          password: ${{ secrets.PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/api.dockerfile
          push: true
          tags: | 
            ${{ secrets.ADRESSE }}/randriantsoa-nathan-backend:latest
            ${{ secrets.ADRESSE }}/randriantsoa-nathan-backend:${{ github.sha }}

  push-docker-frontend:
    runs-on: ubuntu-latest
    environment : dev
    steps: 
      - uses: actions/checkout@v3

      - name: Login to docker hub
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ADRESSE }}
          username: ${{ secrets.LOGIN }}
          password: ${{ secrets.PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/web.dockerfile
          push: true
          tags: | 
            ${{ secrets.ADRESSE }}/randriantsoa-nathan-frontend:latest
            ${{ secrets.ADRESSE }}/randriantsoa-nathan-frontend:${{ github.sha }}

  deploy-dev:
    needs:
      - push-docker-backend
      - push-docker-frontend
    uses: ./.github/workflows/ansible-deploy.yml
    with: 
      mode: dev
      env_mode: dev
      prefix: dev-
      app_directory: "/home/student/apps/randriantsoa-nathan-dev"
    secrets:
      SSHKEY: ${{ secrets.SSHKEY }}
      PASSWORD: ${{ secrets.PASSWORD }}
    
  deploy-test:
    needs:
      - push-docker-backend
      - push-docker-frontend
      - deploy-dev
    uses: ./.github/workflows/ansible-deploy.yml
    with: 
      mode: test
      env_mode: test
      prefix: test-
      app_directory: "/home/student/apps/randriantsoa-nathan-test"
    secrets:
      SSHKEY: ${{ secrets.SSHKEY }}
      PASSWORD: ${{ secrets.PASSWORD }}
    

  deploy-prod:
    needs:
      - push-docker-backend
      - push-docker-frontend
      - deploy-test
    uses: ./.github/workflows/ansible-deploy.yml
    with: 
      mode: ""
      env_mode: prod
      prefix: ""
      app_directory: "/home/student/apps/randriantsoa-nathan-prod"  
    secrets:
      SSHKEY: ${{ secrets.SSHKEY }}
      PASSWORD: ${{ secrets.PASSWORD }}
    