name: CD deployment Docker

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  push-docker-backend:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v3

      - name: Login to docker hub
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ADRESSE }}
          username: ${{ secrets.LOGIN }}
          password: ${{ secrets.PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/api.dockerfile
          push: true
          tags: |
            ${{ secrets.ADRESSE }}/randriantsoa-nathan-backend:latest
            ${{ secrets.ADRESSE }}/randriantsoa-nathan-backend:${{ github.sha }}

  push-docker-frontend:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v3

      - name: Login to docker hub
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ADRESSE }}
          username: ${{ secrets.LOGIN }}
          password: ${{ secrets.PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/web.dockerfile
          push: true
          tags: |
            ${{ secrets.ADRESSE }}/randriantsoa-nathan-frontend:latest
            ${{ secrets.ADRESSE }}/randriantsoa-nathan-frontend:${{ github.sha }}

  deploy-dev:
    if: github.event_name == 'push'
    needs:
      - push-docker-backend
      - push-docker-frontend
    uses: ./.github/workflows/ansible-deploy.yml
    with:
      mode: dev
      env_mode: dev
      prefix: dev-
      app_directory: "/home/student/apps/randriantsoa-nathan-dev"
      git_env: dev
    secrets:
      SSHKEY: ${{ secrets.SSHKEY }}
      PASSWORD: ${{ secrets.PASSWORD }}

  deploy-test:
    if: github.event_name == 'push'
    needs:
      - push-docker-backend
      - push-docker-frontend
      - deploy-dev
    uses: ./.github/workflows/ansible-deploy.yml
    with:
      mode: test
      env_mode: test
      prefix: test-
      app_directory: "/home/student/apps/randriantsoa-nathan-test"
      git_env: test
    secrets:
      SSHKEY: ${{ secrets.SSHKEY }}
      PASSWORD: ${{ secrets.PASSWORD }}

  deploy-prod:
    if: github.event_name == 'push'
    needs:
      - push-docker-backend
      - push-docker-frontend
      - deploy-test
    uses: ./.github/workflows/ansible-deploy.yml
    with:
      mode: ""
      env_mode: prod
      prefix: ""
      app_directory: "/home/student/apps/randriantsoa-nathan-prod"
      git_env: production
    secrets:
      SSHKEY: ${{ secrets.SSHKEY }}
      PASSWORD: ${{ secrets.PASSWORD }}

  deploy-pr:
    if: github.event_name == 'pull_request'
    needs:
      - push-docker-backend
      - push-docker-frontend
    uses: ./.github/workflows/ansible-deploy.yml
    with:
      mode: pr
      env_mode: pr
      prefix: pr-${{ github.event.pull_request.number }}-
      app_directory: "/home/student/apps/randriantsoa-nathan-pr"
    secrets:
      SSHKEY: ${{ secrets.SSHKEY }}
      PASSWORD: ${{ secrets.PASSWORD }}

  test:
    if: github.event_name == 'pull_request'
    needs:
      - deploy-pr
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: |
        cd ./playwright
        npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: npx playwright test

    - name: create prefix
      run: |
        echo "PREF=${{ pr-${{ github.event.pull_request.number }}- }}" > .env

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
