name: CD deployement Docker
on:
  push:
    branches: [ main ]
  pull_request:
    branches:
      - main

jobs:
  push-docker-backend:
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v3

      - name: Login to docker hub
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ADRESSE }}
          username: ${{ secrets.LOGIN }}
          password: ${{ secrets.PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/api.dockerfile
          push: true
          tags: | 
            ${{ secrets.ADRESSE }}/randriantsoa-nathan-backend:latest
            ${{ secrets.ADRESSE }}/randriantsoa-nathan-backend:${{ github.sha }}

  push-docker-frontend:
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v3

      - name: Login to docker hub
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ADRESSE }}
          username: ${{ secrets.LOGIN }}
          password: ${{ secrets.PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/web.dockerfile
          push: true
          tags: | 
            ${{ secrets.ADRESSE }}/randriantsoa-nathan-frontend:latest
            ${{ secrets.ADRESSE }}/randriantsoa-nathan-frontend:${{ github.sha }}

  deploy-dev:
    name: Deploy to dev server
    runs-on: ubuntu-latest
    needs: ["push-docker-frontend"] #, "push-docker-frontend"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSHKEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 62204 dev04.iut.arcanit.io >> ~/.ssh/known_hosts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSHKEY }}

      - name: Install Ansible
        run: |
        
          pip install ansible

      - name: Run Ansible Playbook
        run: |
          cd ansible/ 
          ansible-playbook deploy.yml \
            -i inventory.ini \
            -e "image_tag=${{ github.sha }}" \
            -e "registry_password=${{ secrets.PASSWORD }}"