name: CD deployement Docker
on:
  push:
    branches: [ main ]
  pull_request:
    branches:
      - main

jobs:
  push-docker-backend:
    runs-on: ubuntu-latest
    steps: 
      - name: Login to docker hub
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ADRESSE }}
          username: ${{ secrets.LOGIN }}
          password: ${{ secrets.PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/api.dockerfile
          push: true
          tags: | 
            docker.iut.arcanit.io/randriantsoa-nathan-backend:latest
            docker.iut.arcanit.io/randriantsoa-nathan-backend:${{ github.sha }}