name: CD deployement Docker
on:
  push:
    branches: [ main ]
  pull_request:
    branches:
      - main

jobs:
  push-docker-backend:
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v3

      - name: Login to docker hub
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HIKARIREGISTRY }}
          username: ${{ secrets.HIKARILOGIN }}
          password: ${{ secrets.HIKARIPWD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/api.dockerfile
          push: true
          tags: | 
            ${{ secrets.HIKARIREGISTRY }}/randriantsoa-nathan-backend:latest
            ${{ secrets.HIKARIREGISTRY }}/randriantsoa-nathan-backend:${{ github.sha }}

  push-docker-frontend:
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v3

      - name: Login to docker hub
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HIKARIREGISTRY }}
          username: ${{ secrets.HIKARILOGIN }}
          password: ${{ secrets.HIKARIPWD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/web.dockerfile
          push: true
          tags: | 
            ${{ secrets.HIKARIREGISTRY }}/randriantsoa-nathan-frontend:latest
            ${{ secrets.HIKARIREGISTRY }}/randriantsoa-nathan-frontend:${{ github.sha }}