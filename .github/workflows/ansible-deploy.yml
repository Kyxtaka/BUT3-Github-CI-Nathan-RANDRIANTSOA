name: Ansible Deploy

on: 
  workflow_call:
    inputs: 
      mode: 
        description: 'deployement mode'
        default: 
        required: true
        type: string

      env_mode: 
        description: 'env deployement mode'
        default: prod
        required: true
        type: string

      prefix:
        description: 'env deployement mode'
        default: 
        required: true
        type: string

      app_directory:
        description: 'container directory'
        required: true
        default: "/home/student/apps/nathan-prod"
        type: string

      inputs:
        git_env:
          description: github environment
          defulault: dev
          type: string
          required: false

    secrets:
      SSHKEY:
        required: true
      PASSWORD: 
        required: true

jobs: 
  reusable-deploy:
    environment: ${{ inputs.git_env }}
    name: Deploy to dev server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSHKEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 62204 dev04.iut.arcanit.io >> ~/.ssh/known_hosts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSHKEY }}

      - name: Install Ansible
        run: |
        
          pip install ansible

      - name: Run Ansible Playbook
        run: |
          cd ansible/ 
          ansible-playbook deploy.yml \
            -i inventory.ini \
            -e "image_tag=${{ github.sha }}" \
            -e "registry_password=${{ secrets.PASSWORD }}" \
            -e "mode"=${{ inputs.mode }} \
            -e "env_mode"=${{ inputs.env_mode }} \
            -e "domaine_prefix"=${{ inputs.prefix }} \
            -e "app_directory"=${{ inputs.app_directory }}